
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWISTOPIA - Jump Adventure</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            text-align: center;
            margin: 0;
            padding: 8px;
            overflow-x: hidden;
        }

        h1 {
            font-size: 25px;
            margin: 8px 0 4px;
        }

        .game-info {
            display: flex;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
            font-size: 15px;
            font-weight: bold;
            margin: 8px;
        }

        .game-container {
            width: min(94vw, 650px);
            margin: 8px auto;
        }

        #jumpCanvas {
            width: 100%;
            height: auto;
            display: block;
            border: 3px solid #38bdf8;
            border-radius: 12px;
            background: #bae6fd;
            touch-action: none;
        }

        #message {
            min-height: 22px;
            font-size: 15px;
            font-weight: bold;
            margin: 6px;
        }

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 15px auto 45px;
    position: relative;
    z-index: 2;
}

.game-buttons {
    margin-top: 25px;
    padding-bottom: 20px;
    position: relative;
    z-index: 1;
}

.game-buttons button {
    padding: 12px 15px;
    margin: 5px;
    border: none;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}


        .controls button:active {
            background: #facc15;
        }

        .game-buttons button {
            padding: 10px 15px;
            margin: 3px;
            border: none;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        #restartBtn {
            background: #facc15;
        }

        #backBtn {
            background: #bbf7d0;
        }

        @media (max-height: 700px) {
            h1 {
                font-size: 21px;
                margin: 4px;
            }

            .game-container {
                width: min(80vw, 500px);
            }

            .controls {
                margin: 5px auto;
            }

            .controls button {
                height: 42px;
            }
        }
    </style>
</head>

<body>

    <h1>🚀 JUMP ADVENTURE</h1>
    <p>Jump over obstacles and collect the stars!</p>

    <div class="game-info">
        <span>⭐ Stars: <span id="stars">0</span></span>
        <span>❤️ Lives: <span id="lives">3</span></span>
    </div>

    <div class="game-container">
        <canvas id="jumpCanvas" width="650" height="360"></canvas>
    </div>

    <p id="message">Press JUMP to start your adventure!</p>

    <div class="controls">
        <button id="leftBtn">⬅️</button>
        <button id="jumpBtn">⬆️ JUMP</button>
        <button id="rightBtn">➡️</button>
    </div>

    <div class="game-buttons">
        <button id="restartBtn">🔄 Restart</button>
        <button id="backBtn">🏠 Main Menu</button>
    </div>

    <script src="jump.js"></script>

</body>
</html>
